[project]
name = "vaaniguard"
version = "0.1.0"
description = "VaaniGuard: risk-adaptive verification for high-risk financial voice interactions (hackathon prototype)"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "sqlmodel>=0.0.22",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "cryptography>=43",
  "numpy>=2.4.6",
  "scipy>=1.17.1",
  "soundfile>=0.14.0",
  "faster-whisper>=1.2.1",
]

# Phase 3 adds librosa/transformers/resemblyzer.

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
