# VaaniGuard risk fusion configuration (SPEC section F).
# Tune weights only within +-0.05 of these values and log changes in DECISIONS.md.

weights:
  voice: 0.20       # V
  scam: 0.15        # S
  urgency: 0.10     # U
  financial: 0.20   # F
  context: 0.20     # C
  identity: 0.15    # I

# Inclusive lower bounds. LOW 0-29, MEDIUM 30-59, HIGH 60-79, CRITICAL 80-100.
tiers:
  LOW: 0
  MEDIUM: 30
  HIGH: 60
  CRITICAL: 80

rules:
  R1_credential_request:
    min_score: 85
  R2_context_led:
    financial_min: 60
    context_min: 70
    urgency_min: 50      # (U >= urgency_min OR I >= identity_min)
    identity_min: 60
    min_score: 70
  R3_voice_plus_money:
    voice_min: 70
    voice_confidence_min: 0.5
    financial_min: 60
    bonus: 8
  R4_single_signal_cap:
    high_signal_min: 60  # exactly one signal at or above this...
    others_below: 30     # ...and every other available signal below this
    cap: 59
    # R4 is skipped when R1 or R2 fired (strong, detector-independent rules)
  R5_low_coverage:
    coverage_below: 0.5
    score_min: 40
    min_tier: MEDIUM
    flag: "Insufficient evidence — verification recommended."

# Section G: verification outcome adjustments
verification:
  pass_delta: -35
  cooling_off_amount_inr: 100000

# Section G: hardened-mode threshold jitter (points)
hardened_jitter: 3

# Section F/L: voice authenticity engine. Heuristic thresholds are UNCALIBRATED starting points
# (no labelled Indian telephony data); each maps a feature value to 0-100 linearly between
# `ok` (score 0) and `bad` (score 100).
voice:
  model_id: MelodyMachine/Deepfake-audio-detection-V2
  model_weight: 0.7
  heuristic_weight: 0.3
  window_s: 4.0
  max_windows: 16
  model_budget_s: 6.0          # stop scoring further windows after this much wall time
  model_base_confidence: 0.75  # capped: the model is not validated on Indian telephony audio
  heuristic_max_confidence: 0.4
  quality:
    short_duration_s: 3.0
    short_duration_factor: 0.5
    low_snr_db: 10.0
    low_snr_factor: 0.6
    telephony_bandwidth_hz: 4000
    telephony_factor: 0.6
  heuristics:
    dynamic_range_db: {ok: 35.0, bad: 65.0}   # speech peak minus noise floor; unnaturally clean = high
    pitch_std_semitones: {ok: 3.0, bad: 1.0}  # flat pitch = high
    flatness_variance: {ok: 0.004, bad: 0.0005}
    pauses_per_10s: {ok: 2.0, bad: 0.0}       # no breath/pause gaps = high
    hf_energy_ratio: {ok: 0.01, bad: 0.0005}  # only for wideband audio
